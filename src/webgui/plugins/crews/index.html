<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Crews · agnostic</title>
<style>
:root {
  --bg: #060a0f;
  --panel: #0c131c;
  --panel-2: #111b27;
  --line: #1c2a38;
  --line-2: #2a3d50;
  --text: #d4e4f1;
  --dim: #7d93a8;
  --faint: #4b6075;
  --accent: #39d0ff;
  --ok: #22c55e;
  --warn: #f59e0b;
  --err: #ef4444;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
body { display: flex; flex-direction: column; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--dim); }
.mono { font-family: var(--mono); }
.btn { background: #0f1823; border: 1px solid var(--line-2); border-radius: 5px; padding: 5px 11px; font: 600 12px var(--sans); }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: #0e3346; border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--err); border-color: rgba(239, 68, 68, .5); }
.btn.link { color: var(--accent); }

.bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-2); background: var(--panel-2); flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: none; border: 1px solid var(--line-2); border-radius: 12px; padding: 2px 11px; color: var(--dim); font-weight: 600; font-size: 12px; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: #0e3346; }
.spacer { flex: 1; }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 360px) 1fr; }
.list { border-right: 1px solid var(--line-2); overflow: auto; }
.detail { overflow: auto; padding: 18px 22px 48px; min-width: 0; }
.row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 12px; }
.row:hover { background: #0b141e; }
.row[aria-current="true"] { background: #0e2433; box-shadow: inset 3px 0 0 var(--accent); }
.row .top { display: flex; gap: 8px; align-items: center; }
.row .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--dim); font-size: 11.5px; display: flex; gap: 10px; margin-top: 2px; flex-wrap: wrap; }
.foot { padding: 12px; color: var(--dim); font-size: 12px; }
.pill { font: 600 10px var(--mono); letter-spacing: .06em; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line-2); color: var(--dim); text-transform: uppercase; white-space: nowrap; }
.pill.running, .pill.pending { color: var(--accent); border-color: rgba(57, 208, 255, .45); }
.pill.completed { color: var(--ok); border-color: rgba(34, 197, 94, .45); }
.pill.failed, .pill.unknown { color: var(--err); border-color: rgba(239, 68, 68, .45); }
.pill.cancelled, .pill.interrupted, .pill.queued { color: var(--warn); border-color: rgba(245, 158, 11, .45); }
.pill.notrun { color: var(--faint); border-style: dashed; }

h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 12px; margin: 22px 0 8px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.id { color: var(--faint); font: 12px var(--mono); user-select: all; margin-top: 2px; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.fact { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; min-width: 0; }
.fact .k { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
.fact .v { font-family: var(--mono); font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 11px; margin-top: 12px; color: var(--dim); }
.box.warn { border-color: rgba(245, 158, 11, .5); color: var(--warn); }
.box.bad { border-color: rgba(239, 68, 68, .5); color: var(--err); }
.tasks { width: 100%; border-collapse: collapse; }
.tasks th { text-align: left; color: var(--dim); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--line-2); }
.tasks td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tasks td.n { color: var(--faint); font-family: var(--mono); width: 2.5em; }
.tasks .ttl { font-weight: 600; }
.tasks .use { color: var(--dim); font: 11.5px var(--mono); white-space: nowrap; }
.tasks details { margin-top: 4px; }
.tasks summary { color: var(--accent); cursor: pointer; font-size: 12px; }
.tasks pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 8px; font: 12px/1.45 var(--mono); max-height: 360px; overflow: auto; }
.tasks .err { color: var(--err); font-size: 12px; margin-top: 3px; }
.feed { list-style: none; margin: 0; padding: 0; font: 12px/1.5 var(--mono); max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.feed li { padding: 3px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
.feed li:last-child { border-bottom: 0; }
.feed .t { color: var(--faint); min-width: 5.5em; text-align: right; }
.lede { color: var(--dim); margin: 6px 0 0; max-width: 75ch; }
.compose { max-width: 900px; }
.compose label { display: block; color: var(--dim); margin: 12px 0 3px; }
.compose .hint { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.compose input[type="text"], .compose input[type="number"], .compose textarea, .compose select { width: 100%; background: #0b131c; border: 1px solid var(--line-2); border-radius: 5px; padding: 6px 9px; }
.compose textarea { min-height: 58px; resize: vertical; }
.compose .line { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 8px; align-items: center; margin-top: 6px; }
.compose .line.task { grid-template-columns: 2fr 1fr auto; align-items: start; }
.compose .line label { margin: 0; color: var(--text); white-space: nowrap; }
.compose .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.offer { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 11px; margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.offer .what { flex: 1; min-width: 200px; }
.offer .nm { font-weight: 600; }
.empty { color: var(--dim); padding: 48px 20px; text-align: center; max-width: 60ch; margin: 0 auto; }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: minmax(160px, 40%) 1fr; }
  .list { border-right: 0; border-bottom: 1px solid var(--line-2); }
  .compose .line, .compose .line.task, .compose .two { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="chips" id="filters" role="group" aria-label="Show crews"></div>
  <span class="spacer"></span>
  <span class="muted" id="scope"></span>
  <button class="btn" id="refresh" type="button">Refresh</button>
  <button class="btn primary" id="new-crew" type="button" hidden>New crew</button>
</header>
<div class="layout" id="layout">
  <nav class="list" aria-label="Crews"><div id="list"></div><div class="foot" id="list-foot"></div></nav>
  <main class="detail" id="detail"></main>
</div>
<script>
'use strict';
/* agnostic-kit:host begin — DO NOT EDIT A COPY: the canonical source is src/webgui/kit/host.js,
 * and scripts/gen-webgui.sh refuses a plugin page whose copy differs (`--sync-kit` rewrites them).
 *
 *  Host — the plugin side of agnostic's host bridge (ADR 0005, 0007, 0010).
 *
 *  Framed by the agnostic shell, a plugin page runs in an opaque origin with connect-src 'none': it
 *  cannot reach the API. It asks the shell by postMessage, and the shell answers only what this
 *  plugin's manifest permits, with the signed-in user's own credential (which the page never sees)
 *  — and the server checks the same permissions, and that user's role, again. Protocol 1:
 *
 *     page  → shell   {type:'agnostic:hello', protocol}
 *     shell → page    {type:'agnostic:init', protocol, features[], plugin:{id,name,version},
 *                      permissions[], user:{auth, signedIn, role}, params, views[{id,name}]}
 *     page  → shell   {type:'agnostic:request', id, method, path, body?, ifMatch?, ifNoneMatch?,
 *                      idempotencyKey?}
 *     shell → page    {type:'agnostic:response', id, status, data, etag?}  status 0 = never reached it
 *     page  → shell   {type:'agnostic:navigate', to, params?}             open another view (0.1.10)
 *     shell → page    {type:'agnostic:params', params}                    this view's params changed
 *
 *  The shell re-sends init after a sign-in or sign-out. `params` is the part of the shell's URL after
 *  `#plugin/<id>?` — a deep link into this view, e.g. `crew=<uuid>`. `views` lists the views switched
 *  on, so a page offers a link only to one that will open. Opened on its own (a new tab) there is no
 *  shell: `mode` is 'standalone', and the page must degrade.
 */
class Host {
  constructor({ helloMs = 3000, timeoutMs = 30000 } = {}) {
    this.mode = 'connecting';  // 'connecting' | 'connected' | 'standalone'
    this.info = null;          // the latest agnostic:init
    this.params = '';          // this view's params, from init or agnostic:params
    this.pending = new Map();  // request id → {resolve, timer}
    this.seq = 0;
    this.timeoutMs = timeoutMs;
    // A random prefix per page load: request ids restart with every load, and a reply the shell
    // sends after a reload must never match a request of this page that happens to share a number.
    this.prefix = 'q' + Host.token(6) + '-';
    this.listeners = new Set();
    this.paramListeners = new Set();
    let framed = false;
    try { framed = window.parent !== window; } catch (err) { framed = true; }
    if (!framed) { this.mode = 'standalone'; return; }
    window.addEventListener('message', (e) => this.onMessage(e));
    try { window.parent.postMessage({ type: 'agnostic:hello', protocol: 1 }, '*'); } catch (err) { /* detached */ }
    // A parent that never answers is not the agnostic shell (or is an older one): stand alone.
    this.timer = setTimeout(() => { if (this.mode === 'connecting') this.setMode('standalone'); }, helloMs);
  }
  /** `n` random characters of [a-z0-9]. */
  static token(n) {
    const b = new Uint8Array(n);
    try { crypto.getRandomValues(b); } catch (err) { for (let i = 0; i < n; i++) b[i] = Math.floor(Math.random() * 256); }
    let s = '';
    for (const x of b) s += (x % 36).toString(36);
    return s;
  }
  onMessage(e) {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || typeof m !== 'object' || typeof m.type !== 'string') return;
    if (m.type === 'agnostic:init') {
      const u = m.user && typeof m.user === 'object' ? m.user : {};
      this.info = {
        plugin: m.plugin && typeof m.plugin === 'object' ? m.plugin : {},
        permissions: Array.isArray(m.permissions) ? m.permissions.filter((x) => typeof x === 'string') : [],
        features: Array.isArray(m.features) ? m.features.filter((x) => typeof x === 'string') : [],
        user: { auth: typeof u.auth === 'string' ? u.auth : 'unknown', signedIn: !!u.signedIn, role: typeof u.role === 'string' ? u.role : null },
        views: Array.isArray(m.views) ? m.views.filter((v) => v && typeof v.id === 'string' && typeof v.name === 'string') : [],
      };
      clearTimeout(this.timer);
      const params = typeof m.params === 'string' ? m.params : '';
      const changed = params !== this.params;
      this.params = params;
      this.setMode('connected');
      if (changed) this.emitParams();
    } else if (m.type === 'agnostic:params') {
      this.params = typeof m.params === 'string' ? m.params : '';
      this.emitParams();
    } else if (m.type === 'agnostic:response') {
      const r = this.pending.get(m.id);
      if (!r) return;
      this.pending.delete(m.id);
      clearTimeout(r.timer);
      r.resolve({ status: Number.isInteger(m.status) ? m.status : 0, data: m.data === undefined ? null : m.data, etag: typeof m.etag === 'string' ? m.etag : null });
    }
  }
  setMode(mode) { this.mode = mode; for (const fn of this.listeners) fn(this); }
  /** Called on every init (and the fall back to standalone); returns an unsubscribe. */
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  /** Called when this view's params change — a deep link followed while it is open. */
  onParams(fn) { this.paramListeners.add(fn); return () => this.paramListeners.delete(fn); }
  emitParams() { for (const fn of this.paramListeners) fn(this.params); }
  /** One param of this view: `param('crew')` for `crew=<uuid>`; '' when absent. */
  param(name) {
    for (const pair of this.params.split('&')) {
      const i = pair.indexOf('=');
      const k = i < 0 ? pair : pair.slice(0, i);
      if (k === name) { try { return decodeURIComponent(i < 0 ? '' : pair.slice(i + 1)); } catch (err) { return ''; } }
    }
    return '';
  }
  can(permission) { return this.mode === 'connected' && this.info.permissions.includes(permission); }
  /** Whether the shell's bridge carries `feature` ('query' | 'revisions' | 'idempotency' | 'navigate'). */
  has(feature) { return this.mode === 'connected' && this.info.features.includes(feature); }
  pluginId() { return (this.info && typeof this.info.plugin.id === 'string' && this.info.plugin.id) || ''; }
  /** The user's role when the server enforces roles; null when auth is off or unknown. */
  role() { return this.info && this.info.user.auth === 'required' ? this.info.user.role : null; }
  /** Whether the user may write at all: any role but viewer. */
  mayWrite() { return this.mode === 'connected' && this.role() !== 'viewer'; }
  /** Whether view `id` is switched on — so a link to it will open. */
  hasView(id) { return this.mode === 'connected' && this.info.views.some((v) => v.id === id); }
  /** Open another view (or 'overview' / 'settings'), with params for it. Resolves false when it cannot. */
  navigate(to, params) {
    if (!this.has('navigate')) return false;
    try { window.parent.postMessage({ type: 'agnostic:navigate', to: String(to), params: params ? String(params) : '' }, '*'); } catch (err) { return false; }
    return true;
  }
  /** `opts`: {ifMatch, ifNoneMatch, idempotencyKey}, each sent only when the shell carries it. */
  request(method, path, body, opts) {
    if (this.mode !== 'connected') return Promise.resolve({ status: 0, data: { error: 'not connected to agnostic' }, etag: null });
    const id = this.prefix + ++this.seq;
    return new Promise((resolve) => {
      const timer = setTimeout(() => { if (this.pending.delete(id)) resolve({ status: 0, data: { error: 'the shell did not answer' }, etag: null }); }, this.timeoutMs);
      this.pending.set(id, { resolve, timer });
      const msg = { type: 'agnostic:request', id, method, path };
      if (body !== undefined) msg.body = body;
      const o = opts || {};
      if (o.ifMatch && this.has('revisions')) msg.ifMatch = o.ifMatch;
      if (o.ifNoneMatch && this.has('revisions')) msg.ifNoneMatch = o.ifNoneMatch;
      if (o.idempotencyKey && this.has('idempotency')) msg.idempotencyKey = o.idempotencyKey;
      try { window.parent.postMessage(msg, '*'); } catch (err) { this.pending.delete(id); clearTimeout(timer); resolve({ status: 0, data: { error: 'the shell is gone' }, etag: null }); }
    });
  }
}
/** The error text of a bridge response. */
function errOf(r) {
  if (r && r.data && typeof r.data.error === 'string') return r.data.error;
  return r && r.status ? 'HTTP ' + r.status : 'the server is unreachable';
}
/* agnostic-kit:host end */

/* =====================================================================================
 *  CREWS — every crew in this tenant, live (0.1.10)
 *
 *  The list is GET /api/v1/crews, a page at a time by its cursor, filtered by status on the
 *  server. A crew opened is GET /crews/{id} (its outcome), /plan (its tasks, in request order)
 *  and — while it runs — /events?after=N, which reads each event once. Tasks are the plan's,
 *  bound to events and results by the engine's task id. What is open is in the URL
 *  (`#plugin/crews?crew=<uuid>&status=<filter>`), so it is a link anyone can follow.
 *
 *  Since 0.4.3 a crew can be started here, by saying who it needs: a `team`, which the server turns
 *  into agents at the door (ADR 0037), and the plan shows who it became. POST
 *  /api/v1/preset-recommendations says which preset fits, and a preset's roles can fill the team.
 *
 *  Everything above the VIEW section is plain logic with no DOM — tests/webgui/crews.test.mjs
 *  runs it in Node against a fake agnostic.
 * ===================================================================================== */
const FILTERS = Object.freeze([
  Object.freeze({ id: 'all', label: 'All', status: '' }),
  Object.freeze({ id: 'active', label: 'Active', status: 'active' }),
  Object.freeze({ id: 'completed', label: 'Completed', status: 'completed' }),
  Object.freeze({ id: 'failed', label: 'Failed', status: 'failed' }),
  Object.freeze({ id: 'cancelled', label: 'Cancelled', status: 'cancelled' }),
  // A crew a server restart cut short (agnostic 0.1.13, ADR 0013): terminal, its work lost.
  Object.freeze({ id: 'interrupted', label: 'Interrupted', status: 'interrupted' }),
]);
const ACTIVE = Object.freeze(['pending', 'running']);
const PAGE_SIZE = 50;
const MAX_EVENTS = 400;              // events kept for the feed, newest
const MAX_TAIL_POLLS = 120;          // polls of a cancelled crew waiting for its last results
const RE_CREW_ID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const RE_PRESET = /^[a-z0-9][a-z0-9-]{0,99}$/;
// The server's own bounds on a team (src/engine/team.cyr): said here so a slip is caught at the field.
const TEAM_MAX = 20, ROLE_MAX = 200, CONTEXT_MAX = 1000, PROJECT_MAX = 2000;
const isActive = (s) => ACTIVE.includes(s);
const filterOf = (id) => FILTERS.find((f) => f.id === id) || FILTERS[0];
const int = (v) => (Number.isInteger(v) ? v : null);

/** First line of `s`, squeezed to at most `n` characters. */
function oneLine(s, n) {
  const t = String(s || '').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
}
function taskTitle(description, i) { return oneLine(description, 90) || 'Task ' + (i + 1); }
function fmtTokens(n) {
  if (!Number.isFinite(n)) return '—';
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k';
  return (n / 1e6).toFixed(1) + 'M';
}
/** Micro-USD as dollars. An absent cost is not a zero cost: callers pass only a real one. */
function fmtMicro(m) {
  if (!Number.isFinite(m)) return '—';
  const usd = m / 1e6;
  if (usd === 0) return '$0';
  return '$' + usd.toFixed(usd < 0.01 ? 4 : 2);
}
function fmtDuration(ms) {
  if (!Number.isFinite(ms) || ms < 0) return '—';
  if (ms < 1000) return Math.round(ms) + ' ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(s < 10 ? 1 : 0) + ' s';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min ' + Math.round(s - m * 60) + ' s';
  return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
}
function fmtAgo(ms, now) {
  if (!Number.isFinite(ms) || ms <= 0) return '';
  const d = Math.max(0, (now || Date.now()) - ms);
  if (d < 45e3) return 'just now';
  if (d < 3600e3) return Math.round(d / 60e3) + ' min ago';
  if (d < 86400e3) return Math.round(d / 3600e3) + ' h ago';
  return new Date(ms).toISOString().slice(0, 10);
}
/** A listing row worth showing: a crew id and a status. */
function validRow(c) {
  return !!c && typeof c === 'object' && typeof c.crew_id === 'string' && RE_CREW_ID.test(c.crew_id) && typeof c.status === 'string';
}
/** The URL of the `target` on crew or task object `o`, or '' (agnostic 0.4.0). */
function targetOf(o) {
  const t = o && typeof o === 'object' ? o.target : null;
  return t && typeof t === 'object' && typeof t.url === 'string' ? t.url : '';
}

/** Whether listing row `x` comes before `y` — the server's order: newer `submitted_at` first, then the higher id. */
function listsBefore(x, y) {
  const xs = int(x.submitted_at) || 0, ys = int(y.submitted_at) || 0;
  if (xs !== ys) return xs > ys;
  return String(x.crew_id) > String(y.crew_id);
}
/**
 * A refreshed first page merged into the list held. The fresh page replaces every crew it
 * covers — new ones appear, finished ones change, ones that left the filter go — and the crews
 * held from LATER pages (listed after the fresh page's last) stay after it, with the cursor
 * that continues past them.
 */
function mergeFirstPage(held, heldNext, fresh, freshNext) {
  if (!freshNext || !fresh.length) return { crews: fresh.slice(), next: freshNext || null };
  const last = fresh[fresh.length - 1];
  const ids = new Set(fresh.map((c) => c.crew_id));
  const tail = held.filter((c) => !ids.has(c.crew_id) && listsBefore(last, c));
  return { crews: fresh.concat(tail), next: tail.length ? heldNext : freshNext };
}
/** `?status=<filter>&crew=<id>` for a view state, leaving out the defaults. */
function paramsFor(filter, crew) {
  const p = [];
  if (filter && filter !== 'all') p.push('status=' + filter);
  if (crew) p.push('crew=' + crew);
  return p.join('&');
}

const blankMember = () => ({ role: '', context: '', tools: '', lead: false });
const blankTask = () => ({ description: '', expected: '' });
/** A blank composer: one member and one task, as a crew needs at least that. */
function blankCrew() {
  return { name: '', about: '', project: '', process: 'sequential', concurrency: '', target: '', members: [blankMember()], tasks: [blankTask()] };
}
/** Tool names from text: commas or newlines, trimmed, without repeats. */
function parseTools(text) {

  }
  /** Change the filter or the crew — through the shell when it can, so the URL is a link to it. */
  go(filter, crew) {
    this.composing = false;
    this.emit();
    const params = paramsFor(filter, crew);
    if (this.host.navigate(this.host.pluginId() || 'crews', params)) return;
    this.host.params = params;
    this.applyParams(false);
  }
  open(id) {
    if (this.detail) { this.detail.stop(); this.detail = null; }
    this.selected = id;
    if (!id) return;
    const d = new CrewDetail(this.host, id, this.opts);
    this.detail = d;
    d.onChange(() => { if (this.detail === d) { this.list.patch(id, d.listFields()); this.emitDetail(); } });
    d.start();
  }
  mayCancel() { return this.host.can('crews:write') && this.host.mayWrite(); }
  mayStart() { return this.host.can('crews:write') && this.host.mayWrite(); }
  mayAsk() { return this.host.can('presets:read'); }
  /** Open the composer, on what was being written if anything was. */
  compose() {
    if (!this.mayStart()) return;
    if (!this.composer) this.composer = new CrewComposer(this.host);
    this.composing = true;
    this.emit();
  }
  closeComposer() { this.composer = null; this.composing = false; this.emit(); }
  async suggest() {
    const c = this.composer;
    if (!c) return null;
    const p = c.suggest();
    this.emit();
    const got = await p;
    this.emit();
    return got;
  }
  async usePreset(name) {
    const c = this.composer;
    if (!c) return false;
    const ok = await c.usePreset(name);
    this.emit();
    return ok;
  }
  /** Start the crew written, and open it: the plan there says who the team became. */
  async start() {
    const c = this.composer;
    if (!c) return { ok: false, message: 'Nothing is being written.' };
    const p = c.submit();
    this.emit();
    const r = await p;
    if (!r.ok) { this.emit(); return r; }
    this.composer = null;
    this.list.refresh();
    // Under `all`: a crew just started would be missing from the list under most filters.
    this.go('all', r.id);
    return r;
  }
}

/* =====================================================================================
 *  VIEW — the DOM. Every value from the server is written with textContent.
 * ===================================================================================== */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function pill(status) { return el('span', 'pill ' + String(status).replace(/[^a-z]/g, ''), status); }

class CrewsView {
  constructor(app) {
    this.app = app;
    this.$ = (id) => document.getElementById(id);
    this.note = '';               // the last action's answer, shown on the open crew
    this.noteFor = '';
    this.confirming = false;      // the cancel button asked "really?"
    this.openOutputs = new Set(); // task ids whose output is unfolded — kept across re-renders
    this.renderFilters();
    this.$('refresh').addEventListener('click', () => { this.app.list.refresh(); if (this.app.detail) this.app.detail.poll(); });
    this.$('new-crew').addEventListener('click', () => this.app.compose());
    app.onChange(() => this.render());
    // Not over the composer: a crew open behind it polls, and rebuilding the form would take the focus.
    app.onDetail(() => { if (!this.app.composing) this.renderDetail(); });
    app.list.onChange(() => this.renderList());
    // Running crews are re-listed every few seconds, others now and then — less when hidden.
    setInterval(() => {
      if (this.app.state() !== 'ready' || document.hidden) return;
      const now = Date.now();
      const every = this.app.list.hasActive() ? 4000 : 30000;
      if (now - (this.listedAt || 0) >= every) { this.listedAt = now; this.app.list.refresh(); }
    }, 1000);
    this.render();
  }
  renderFilters() {
    const box = this.$('filters');
    box.replaceChildren();
    for (const f of FILTERS) {
      const b = el('button', 'chip', f.label);
      b.type = 'button';
      b.dataset.filter = f.id;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => this.app.go(f.id, this.app.selected));
      box.append(b);
    }
  }
  render() {
    for (const b of this.$('filters').children) b.setAttribute('aria-pressed', String(b.dataset.filter === this.app.list.filter));
    const st = this.app.state();
    this.$('layout').hidden = st !== 'ready';
    this.$('filters').hidden = st !== 'ready';
    this.$('refresh').disabled = st !== 'ready';
    this.$('new-crew').hidden = !(st === 'ready' && this.app.mayStart());
    let msg = this.$('message');
    if (st !== 'ready') {
      if (!msg) { msg = el('div', 'empty'); msg.id = 'message'; document.body.append(msg); }
      msg.textContent = st === 'standalone' ? 'This view shows the crews on an agnostic server. Open it from agnostic’s WebGUI (/ui), where it runs as the signed-in user.'
        : st === 'forbidden' ? 'This build of the Crews view was not granted crews:read.' : 'Connecting to agnostic…';
      return;
    }
    if (msg) msg.remove();
    this.renderList();
    this.renderDetail();
  }
  renderList() {
    const l = this.app.list;
    const box = this.$('list');
    const nav = box.parentElement;
    const keep = nav.scrollTop;
    box.replaceChildren();
    const scope = l.scope && l.scope !== '_' ? 'tenant ' + l.scope : '';
    this.$('scope').textContent = scope;
    for (const c of l.crews) {
      const b = el('button', 'row');
      b.type = 'button';
      if (c.crew_id === this.app.selected) b.setAttribute('aria-current', 'true');
      const top = el('div', 'top');
      top.append(el('span', 'nm', c.name || 'Crew ' + c.crew_id.slice(0, 8)), pill(c.status));
      const sub = el('div', 'sub');
      sub.append(el('span', null, fmtAgo(c.submitted_at)));
      if (int(c.tasks_submitted) !== null) sub.append(el('span', null, c.tasks_submitted + ' tasks'));
      if (int(c.finished_at) !== null && int(c.submitted_at) !== null) sub.append(el('span', null, fmtDuration(c.finished_at - (c.started_at || c.submitted_at))));
      if (int(c.total_tokens) !== null) sub.append(el('span', null, fmtTokens(c.total_tokens) + ' tok'));
      if (int(c.cost_micro_usd) !== null) sub.append(el('span', null, fmtMicro(c.cost_micro_usd)));
      if (c.engine_mode === 'placeholder') sub.append(el('span', null, 'placeholder'));
      if (targetOf(c)) sub.append(el('span', null, targetOf(c)));
      b.append(top, sub);
      b.addEventListener('click', () => this.app.go(l.filter, c.crew_id));
      box.append(b);
    }
    const foot = this.$('list-foot');
    foot.replaceChildren();
    if (l.error) foot.append(el('div', 'box bad', l.error));
    else if (l.loading && !l.crews.length) foot.textContent = 'Loading…';
    else if (l.loaded && !l.crews.length) foot.textContent = l.filter === 'all' ? 'No crews yet. Start one here or from Swarm Command, or POST /api/v1/crews — every crew in your tenant is listed here.' : 'No crews match this filter.';
    if (l.next) {
      const more = el('button', 'btn', l.loading ? 'Loading…' : 'Load more');
      more.type = 'button';
      more.disabled = l.loading;
      more.addEventListener('click', () => l.more());
      foot.append(more);
    }
    nav.scrollTop = keep;
  }
  renderDetail() {
    const box = this.$('detail');
    const keep = box.scrollTop;
    const oldFeed = box.querySelector('.feed');
    const atEnd = !oldFeed || oldFeed.scrollTop + oldFeed.clientHeight >= oldFeed.scrollHeight - 4;
    const feedKeep = oldFeed ? oldFeed.scrollTop : 0;
    box.replaceChildren();
    this.fillDetail(box);
    box.scrollTop = keep;
    const feed = box.querySelector('.feed');
    if (feed) feed.scrollTop = atEnd ? feed.scrollHeight : feedKeep;
  }
  /** A text field bound to `obj[name]`: what is typed is kept as it is typed, so a re-render loses nothing. */
  field(obj, name, opts = {}) {
    const i = el(opts.area ? 'textarea' : 'input');
    if (!opts.area) i.type = opts.number ? 'number' : 'text';
    i.value = obj[name] === undefined || obj[name] === null ? '' : String(obj[name]);
    i.spellcheck = false;
    if (opts.placeholder) i.placeholder = opts.placeholder;
    if (opts.label) i.setAttribute('aria-label', opts.label);
    if (opts.id) i.id = opts.id;
    i.addEventListener('input', () => { obj[name] = i.value; });
    return i;
  }
  /** A labelled field, with what it is for beneath it. */
  labelled(box, id, label, control, hint) {
    const l = el('label', null, label);
    l.htmlFor = id;
    control.id = id;
    box.append(l, control);
    if (hint) box.append(el('div', 'hint', hint));
  }
  /** One preset on offer, and the way to use it. */
  offer(box, name, reason) {
    const a = this.app;
    const row = el('div', 'offer');
    const what = el('div', 'what');
    what.append(el('div', 'nm', name));
    if (reason) what.append(el('div', 'muted', reason));
    row.append(what);
    const use = el('button', 'btn', 'Use its roles');
    use.type = 'button';
    use.addEventListener('click', async () => { use.disabled = true; await a.usePreset(name); });
    row.append(use);
    if (a.host.hasView('library')) {
      const see = el('button', 'btn link', 'Open in Library');
      see.type = 'button';
      see.addEventListener('click', () => a.host.navigate('library', 'item=' + name));
      row.append(see);
    }
    box.append(row);
  }
  fillComposer(box) {
    const a = this.app;
    const c = a.composer;
    const f = c.fields;
    box.append(el('h1', null, 'New crew'));
    box.append(el('p', 'lede', 'Say who the crew needs. Each role takes the closest agent you have stored or the preset library holds, and one nothing knows is written from the role. The crew’s page shows who it became.'));
    const form = el('div', 'compose');
    this.labelled(form, 'c-name', 'Name *', this.field(f, 'name'));

    if (a.mayAsk()) {
      this.labelled(form, 'c-about', 'What is it for?', this.field(f, 'about', { area: true }), 'To ask which preset fits. It matches words and uses no model, and it is not sent with the crew.');
      const ask = el('div', 'actions');
      const go = el('button', 'btn', c.suggesting ? 'Asking…' : 'Suggest a preset');
      go.type = 'button';
      go.id = 'c-suggest';
      go.disabled = c.suggesting;
      go.addEventListener('click', () => a.suggest());
      ask.append(go);
      form.append(ask);
      if (c.suggestError) form.append(el('div', 'box bad', c.suggestError));
      if (c.suggestion) {
        const s = c.suggestion;
        this.offer(form, s.preset, s.reason);
        // Nothing matched means nothing to go on, and the words say so.
        if (s.matched.length) form.append(el('div', 'hint', 'It went on: ' + s.matched.join(', ')));
        for (const alt of s.alternatives) this.offer(form, alt.preset, alt.reason);
      }
    }

    form.append(el('h2', null, 'Team'));
    if (c.used) form.append(el('div', 'hint', 'These are the roles of ' + c.used + '. Change them as you like.'));
    f.members.forEach((m, i) => {
      const line = el('div', 'line');
      line.append(this.field(m, 'role', { placeholder: 'Role *', label: 'Role of member ' + (i + 1) }));
      line.append(this.field(m, 'context', { placeholder: 'What should it focus on?', label: 'Focus of member ' + (i + 1) }));
      line.append(this.field(m, 'tools', { placeholder: 'Tools, by commas', label: 'Tools of member ' + (i + 1) }));
      const l = el('label');
      const lead = el('input');
      lead.type = 'checkbox';
      lead.checked = !!m.lead;
      lead.addEventListener('change', () => { m.lead = lead.checked; });
      l.append(lead, document.createTextNode(' Leads'));
      line.append(l);
      const rm = el('button', 'btn', 'Remove');
      rm.type = 'button';
      rm.disabled = f.members.length === 1;
      rm.setAttribute('aria-label', 'Remove member ' + (i + 1));
      rm.addEventListener('click', () => { f.members.splice(i, 1); this.renderDetail(); });
      line.append(rm);
      form.append(line);
    });
    const addM = el('div', 'actions');
    const am = el('button', 'btn', 'Add a member');
    am.type = 'button';
    am.disabled = f.members.length >= TEAM_MAX;
    am.addEventListener('click', () => { f.members.push(blankMember()); this.renderDetail(); });
    addM.append(am);
    form.append(addM);
    this.labelled(form, 'c-project', 'Project context', this.field(f, 'project', { area: true }), 'It reaches every agent’s backstory, and so the model. With no one marked, the first member leads.');

    form.append(el('h2', null, 'Tasks'));
    f.tasks.forEach((t, i) => {
      const line = el('div', 'line task');
      line.append(this.field(t, 'description', { area: true, placeholder: 'What should be done? *', label: 'Task ' + (i + 1) }));
      line.append(this.field(t, 'expected', { area: true, placeholder: 'What should come back?', label: 'Expected output of task ' + (i + 1) }));
      const rm = el('button', 'btn', 'Remove');
      rm.type = 'button';
      rm.disabled = f.tasks.length === 1;
      rm.setAttribute('aria-label', 'Remove task ' + (i + 1));
      rm.addEventListener('click', () => { f.tasks.splice(i, 1); this.renderDetail(); });
      line.append(rm);
      form.append(line);
    });
    const addT = el('div', 'actions');
    const at = el('button', 'btn', 'Add a task');
    at.type = 'button';
    at.addEventListener('click', () => { f.tasks.push(blankTask()); this.renderDetail(); });
    addT.append(at);
    form.append(addT);

    const two = el('div', 'two');
    const left = el('div'), right = el('div');
    const proc = el('select');
    for (const [v, label] of [['sequential', 'One after another'], ['parallel', 'At the same time']]) {
      const o = el('option', null, label);
      o.value = v;
      proc.append(o);
    }
    proc.value = f.process;
    proc.addEventListener('change', () => { f.process = proc.value; this.renderDetail(); });
    this.labelled(left, 'c-process', 'How the tasks run', proc);
    if (f.process === 'parallel') this.labelled(right, 'c-concurrency', 'At most this many at once', this.field(f, 'concurrency', { number: true }));
    two.append(left, right);
    form.append(two);
    this.labelled(form, 'c-target', 'Target', this.field(f, 'target', { placeholder: 'https://…' }), 'What the crew tests, if anything. Only a host this deployment lists can be named.');

    if (c.error) form.append(el('div', 'box bad', c.error));
    const acts = el('div', 'actions');
    // Not a submit: the shell frames this page without `allow-forms`.
    const go = el('button', 'btn primary', c.submitting ? 'Starting…' : 'Start crew');
    go.type = 'button';
    go.id = 'c-start';
    go.disabled = c.submitting;
    go.addEventListener('click', () => a.start());
    const cancel = el('button', 'btn', 'Discard');
    cancel.type = 'button';
    cancel.addEventListener('click', () => a.closeComposer());
    acts.append(go, cancel);
    form.append(acts);
    box.append(form);
  }
  fillDetail(box) {
    if (this.app.composing) { this.fillComposer(box); return; }
    const d = this.app.detail;
    if (this.noteFor !== (d ? d.id : '')) { this.note = ''; this.confirming = false; this.noteFor = d ? d.id : ''; }
    if (!d) { box.append(el('div', 'empty', 'Choose a crew to see its plan, its progress and its results.')); return; }
    if (d.error) { box.append(el('div', 'box bad', d.error)); return; }
    if (!d.loaded) { box.append(el('div', 'muted', 'Loading…')); return; }
    const s = d.summary();
    const h = el('h1');
    h.append(el('span', null, s.name || 'Crew ' + d.id.slice(0, 8)), pill(s.status));
    box.append(h, el('div', 'id', d.id));

    const actions = el('div', 'actions');
    if (isActive(s.status) && this.app.mayCancel()) {
      // Asked inline: the shell frames this page without `allow-modals`, so window.confirm
      // would answer false without asking.
      if (this.confirming && !d.cancelling) {
        const yes = el('button', 'btn danger', 'Yes, cancel it');
        yes.type = 'button';
        yes.addEventListener('click', async () => {
          this.confirming = false;
          const r = await d.cancel();
          if (this.app.detail === d) { this.note = r.message; this.renderDetail(); }
        });
        const no = el('button', 'btn', 'Keep it running');
        no.type = 'button';
        no.addEventListener('click', () => { this.confirming = false; this.renderDetail(); });
        actions.append(el('span', 'muted', 'Cancel this crew? Tasks already running finish; no new task starts.'), yes, no);
      } else {
        const b = el('button', 'btn danger', d.cancelling ? 'Cancelling…' : 'Cancel crew');
        b.type = 'button';
        b.disabled = d.cancelling;
        b.addEventListener('click', () => { this.confirming = true; this.renderDetail(); });
        actions.append(b);
      }
    }
    if (this.app.host.hasView('swarm')) {
      const w = el('button', 'btn link', 'Watch in Swarm Command');
      w.type = 'button';
      w.title = 'Its agents and tasks on the command map';
      w.addEventListener('click', () => this.app.host.navigate('swarm', 'crew=' + d.id));
      actions.append(w);
    }
    if (actions.childElementCount) box.append(actions);
    if (this.note) { box.append(el('div', 'box', this.note)); }

    if (s.mode === 'placeholder') {
      box.append(el('div', 'box warn', 'Placeholder run: this server has no LLM configured, so each task’s output is its own description, not real work.'));
    }
    if (s.error) box.append(el('div', 'box bad', s.error));

    const facts = el('div', 'facts');
    const fact = (k, v, title) => { const f = el('div', 'fact'); f.append(el('div', 'k', k), el('div', 'v', v)); if (title) f.title = title; facts.append(f); };
    fact('Submitted', s.submitted !== null ? fmtAgo(s.submitted) : '—', s.submitted !== null ? new Date(s.submitted).toLocaleString() : '');
    // A cancelled crew's finishing time is when the cancel landed; its running tasks went on.
    if (s.took !== null) fact(s.status === 'cancelled' ? 'Cancelled after' : 'Took', fmtDuration(s.took));
    else if (s.started !== null) fact('Running for', fmtDuration(Date.now() - s.started));
    // A crew a restart cut short says when that was declared; its error box says what it means.
    if (s.interrupted !== null) fact('Interrupted', fmtAgo(s.interrupted), new Date(s.interrupted).toLocaleString());
    fact('Process', s.process ? s.process + (s.maxConcurrency ? ' · ' + s.maxConcurrency + ' at once' : '') : '—');
    // Text, never a link: it came in a request body, and it is the system under test.
    if (s.target) fact('Target', s.target, 'what this crew was pointed at');
    fact('Tasks', s.tasks ? s.done + ' / ' + s.tasks + ' done' + (s.failed ? ' · ' + s.failed + ' failed' : '') + (s.running ? ' · ' + s.running + ' running' : '') : '—');
    fact('Tokens', s.tokens !== null ? fmtTokens(s.tokens) : 'not metered', 'what the engine metered for this crew’s tasks');
    fact('Cost', s.cost !== null ? fmtMicro(s.cost) : 'not priced', 'only a priced call has a cost: an unpriced one is not $0');
    box.append(facts);

    const agents = d.agents();
    if (agents.length) {
      box.append(el('h2', null, 'Agents'));
      const t = el('table', 'tasks');
      const hr = el('tr');
      for (const c of ['Agent', 'Role']) hr.append(el('th', null, c));
      t.append(el('thead'));
      t.firstChild.append(hr);
      const body = el('tbody');
      for (const ag of agents) {
        const tr = el('tr');
        const who = el('td');
        who.append(el('div', 'ttl', ag.name || ag.key));
        if (ag.name && ag.name !== ag.key) who.append(el('div', 'muted', ag.key));
        tr.append(who, el('td', null, ag.role || ''));
        body.append(tr);
      }
      t.append(body);
      box.append(t);
    }

    box.append(el('h2', null, 'Tasks'));
    if (d.planNote) box.append(el('div', 'muted', d.planNote));
    if (d.tasks.length) {
      const t = el('table', 'tasks');
      const hr = el('tr');
      for (const c of ['#', 'Task', 'Status', 'Used']) hr.append(el('th', null, c));
      t.append(el('thead'));
      t.firstChild.append(hr);
      const body = el('tbody');
      for (const task of d.tasks) {
        const tr = el('tr');
        tr.append(el('td', 'n', String(task.index + 1)));
        const main = el('td');
        main.append(el('div', 'ttl', task.title));
        const meta = [];
        if (task.deps.length) meta.push('after ' + task.deps.map((i) => '#' + (i + 1)).join(', '));
        if (task.agent) meta.push('by ' + task.agent);
        if (task.priority && task.priority !== 'normal') meta.push(task.priority + ' priority');
        // A task's own target, when it differs from its crew's.
        if (task.target && task.target !== s.target) meta.push('against ' + task.target);
        if (meta.length) main.append(el('div', 'muted', meta.join(' · ')));
        if (task.outputValid === false) main.append(el('div', 'err', 'Its output is not in the shape this task declared.'));
        if (task.error) main.append(el('div', 'err', task.error));
        if (task.output) {
          const det = el('details');
          det.open = this.openOutputs.has(task.task_id);
          det.addEventListener('toggle', () => { if (det.open) this.openOutputs.add(task.task_id); else this.openOutputs.delete(task.task_id); });
          det.append(el('summary', null, 'Output · ' + task.output.length + ' characters'), el('pre', null, task.output));
          main.append(det);
        }
        tr.append(main);
        const st = el('td');
        // A task still pending when the crew has ended never ran — say that, not "pending".
        st.append(pill(task.status === 'pending' && !d.waiting() && !isActive(s.status) ? 'not run' : task.status));
        tr.append(st);
        const u = task.usage || {};
        const used = [];
        if (int(u.total_tokens) !== null) used.push(fmtTokens(u.total_tokens) + ' tok');
        if (int(u.cost_micro_usd) !== null) used.push(fmtMicro(u.cost_micro_usd));
        if (int(u.duration_ms) !== null) used.push(fmtDuration(u.duration_ms));
        const ut = el('td', 'use', used.join(' · '));
        if (typeof u.model === 'string') ut.title = u.model + (typeof u.provider === 'string' ? ' · ' + u.provider : '');
        tr.append(ut);
        body.append(tr);
      }
      t.append(body);
      box.append(t);
    }

    box.append(el('h2', null, 'Progress'));
    if (d.pollError) box.append(el('div', 'box warn', d.pollError));
    if (!d.events.length) box.append(el('div', 'muted', d.waiting() ? 'Waiting for the first event…' : 'No progress is held for this crew.'));
    else {
      const feed = el('ul', 'feed');
      for (const e of d.events) {
        const li = el('li');
        li.append(el('span', 't', '+' + fmtDuration(e.at)), el('span', null, e.text));
        feed.append(li);
      }
      box.append(feed);
    }
    const gaps = [];
    if (d.missed) gaps.push(d.missed + ' events had left the window before they were read');
    if (d.lost) gaps.push(d.lost + ' events were dropped before agnostic collected them');
    if (gaps.length) box.append(el('div', 'box warn', 'The progress has gaps: ' + gaps.join('; ') + '.'));
  }
}

if (typeof document !== 'undefined' && document.getElementById('detail')) {
  const app = new CrewsApp(new Host(), { isHidden: () => document.hidden });
  window.crews = { app, view: new CrewsView(app) };
}
</script>
</body>
</html>
