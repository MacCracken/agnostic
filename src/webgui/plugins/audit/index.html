<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Audit trail · agnostic</title>
<style>
:root {
  --bg: #060a0f;
  --panel: #0c131c;
  --panel-2: #111b27;
  --line: #1c2a38;
  --line-2: #2a3d50;
  --text: #d4e4f1;
  --dim: #7d93a8;
  --faint: #4b6075;
  --accent: #39d0ff;
  --ok: #22c55e;
  --warn: #f59e0b;
  --err: #ef4444;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 20px 48px; }
.muted { color: var(--dim); }
.btn { background: #0f1823; border: 1px solid var(--line-2); border-radius: 5px; padding: 5px 11px; font: 600 12px var(--sans); }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.chip { background: none; border: 1px solid var(--line-2); border-radius: 12px; padding: 2px 11px; color: var(--dim); font-weight: 600; font-size: 12px; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: #0e3346; }
h1 { font-size: 18px; margin: 0 0 4px; }
.lede { color: var(--dim); margin: 0 0 14px; max-width: 80ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.fact { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 11px; }
.fact .k { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
.fact .v { font: 15px var(--mono); margin-top: 2px; }
.fact.ok .v { color: var(--ok); }
.fact.bad { border-color: rgba(239, 68, 68, .55); }
.fact.bad .v { color: var(--err); }
.box { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 11px; margin-top: 12px; color: var(--dim); }
.box.bad { border-color: rgba(239, 68, 68, .5); color: var(--err); }
.box.warn { border-color: rgba(245, 158, 11, .5); color: var(--warn); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 20px 0 8px; }
.tools input { background: #0b131c; border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 9px; min-width: 220px; }
.spacer { flex: 1; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--dim); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--line-2); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, td.ts, td.h { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
td.act { font: 12.5px var(--mono); white-space: nowrap; }
td.det { overflow-wrap: anywhere; }
td.h .bad { color: var(--err); }
td.h .ok { color: var(--ok); }
.sev { font: 600 10px var(--mono); letter-spacing: .06em; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line-2); text-transform: uppercase; color: var(--dim); }
.sev.warning { color: var(--warn); border-color: rgba(245, 158, 11, .5); }
.sev.error, .sev.critical, .sev.security { color: var(--err); border-color: rgba(239, 68, 68, .5); }
.more { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
.empty { color: var(--dim); padding: 48px 20px; text-align: center; max-width: 60ch; margin: 0 auto; }
@media (max-width: 720px) { td.ts, th.ts, td.h, th.h { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="main">
  <h1>Audit trail</h1>
  <p class="lede">Every change to this server is recorded in a hash-linked chain: each entry carries the hash of the
    one before it, so altering, removing or reordering a stored entry breaks the chain where it happened. The server
    verifies the whole chain when it starts.</p>
  <div class="facts" id="facts"></div>
  <div id="summary-note"></div>
  <div class="tools">
    <div id="sev" role="group" aria-label="Severity"></div>
    <span class="spacer"></span>
    <input id="q" type="search" placeholder="Filter by action or details" aria-label="Filter entries" spellcheck="false">
    <button class="btn" id="refresh" type="button">Refresh</button>
  </div>
  <table>
    <thead><tr><th>#</th><th class="ts">When</th><th>Severity</th><th>Action</th><th>Details</th><th class="h">Chain</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="more" id="more"></div>
</div>
<script>
'use strict';
/* agnostic-kit:host begin — DO NOT EDIT A COPY: the canonical source is src/webgui/kit/host.js,
 * and scripts/gen-webgui.sh refuses a plugin page whose copy differs (`--sync-kit` rewrites them).
 *
 *  Host — the plugin side of agnostic's host bridge (ADR 0005, 0007, 0010).
 *
 *  Framed by the agnostic shell, a plugin page runs in an opaque origin with connect-src 'none': it
 *  cannot reach the API. It asks the shell by postMessage, and the shell answers only what this
 *  plugin's manifest permits, with the signed-in user's own credential (which the page never sees)
 *  — and the server checks the same permissions, and that user's role, again. Protocol 1:
 *
 *     page  → shell   {type:'agnostic:hello', protocol}
 *     shell → page    {type:'agnostic:init', protocol, features[], plugin:{id,name,version},
 *                      permissions[], user:{auth, signedIn, role}, params, views[{id,name}]}
 *     page  → shell   {type:'agnostic:request', id, method, path, body?, ifMatch?, ifNoneMatch?,
 *                      idempotencyKey?}
 *     shell → page    {type:'agnostic:response', id, status, data, etag?}  status 0 = never reached it
 *     page  → shell   {type:'agnostic:navigate', to, params?}             open another view (0.1.10)
 *     shell → page    {type:'agnostic:params', params}                    this view's params changed
 *
 *  The shell re-sends init after a sign-in or sign-out. `params` is the part of the shell's URL after
 *  `#plugin/<id>?` — a deep link into this view, e.g. `crew=<uuid>`. `views` lists the views switched
 *  on, so a page offers a link only to one that will open. Opened on its own (a new tab) there is no
 *  shell: `mode` is 'standalone', and the page must degrade.
 */
class Host {
  constructor({ helloMs = 3000, timeoutMs = 30000 } = {}) {
    this.mode = 'connecting';  // 'connecting' | 'connected' | 'standalone'
    this.info = null;          // the latest agnostic:init
    this.params = '';          // this view's params, from init or agnostic:params
    this.pending = new Map();  // request id → {resolve, timer}
    this.seq = 0;
    this.timeoutMs = timeoutMs;
    // A random prefix per page load: request ids restart with every load, and a reply the shell
    // sends after a reload must never match a request of this page that happens to share a number.
    this.prefix = 'q' + Host.token(6) + '-';
    this.listeners = new Set();
    this.paramListeners = new Set();
    let framed = false;
    try { framed = window.parent !== window; } catch (err) { framed = true; }
    if (!framed) { this.mode = 'standalone'; return; }
    window.addEventListener('message', (e) => this.onMessage(e));
    try { window.parent.postMessage({ type: 'agnostic:hello', protocol: 1 }, '*'); } catch (err) { /* detached */ }
    // A parent that never answers is not the agnostic shell (or is an older one): stand alone.
    this.timer = setTimeout(() => { if (this.mode === 'connecting') this.setMode('standalone'); }, helloMs);
  }
  /** `n` random characters of [a-z0-9]. */
  static token(n) {
    const b = new Uint8Array(n);
    try { crypto.getRandomValues(b); } catch (err) { for (let i = 0; i < n; i++) b[i] = Math.floor(Math.random() * 256); }
    let s = '';
    for (const x of b) s += (x % 36).toString(36);
    return s;
  }
  onMessage(e) {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || typeof m !== 'object' || typeof m.type !== 'string') return;
    if (m.type === 'agnostic:init') {
      const u = m.user && typeof m.user === 'object' ? m.user : {};
      this.info = {
        plugin: m.plugin && typeof m.plugin === 'object' ? m.plugin : {},
        permissions: Array.isArray(m.permissions) ? m.permissions.filter((x) => typeof x === 'string') : [],
        features: Array.isArray(m.features) ? m.features.filter((x) => typeof x === 'string') : [],
        user: { auth: typeof u.auth === 'string' ? u.auth : 'unknown', signedIn: !!u.signedIn, role: typeof u.role === 'string' ? u.role : null },
        views: Array.isArray(m.views) ? m.views.filter((v) => v && typeof v.id === 'string' && typeof v.name === 'string') : [],
      };
      clearTimeout(this.timer);
      const params = typeof m.params === 'string' ? m.params : '';
      const changed = params !== this.params;
      this.params = params;
      this.setMode('connected');
      if (changed) this.emitParams();
    } else if (m.type === 'agnostic:params') {
      this.params = typeof m.params === 'string' ? m.params : '';
      this.emitParams();
    } else if (m.type === 'agnostic:response') {
      const r = this.pending.get(m.id);
      if (!r) return;
      this.pending.delete(m.id);
      clearTimeout(r.timer);
      r.resolve({ status: Number.isInteger(m.status) ? m.status : 0, data: m.data === undefined ? null : m.data, etag: typeof m.etag === 'string' ? m.etag : null });
    }
  }
  setMode(mode) { this.mode = mode; for (const fn of this.listeners) fn(this); }
  /** Called on every init (and the fall back to standalone); returns an unsubscribe. */
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  /** Called when this view's params change — a deep link followed while it is open. */
  onParams(fn) { this.paramListeners.add(fn); return () => this.paramListeners.delete(fn); }
  emitParams() { for (const fn of this.paramListeners) fn(this.params); }
  /** One param of this view: `param('crew')` for `crew=<uuid>`; '' when absent. */
  param(name) {
    for (const pair of this.params.split('&')) {
      const i = pair.indexOf('=');
      const k = i < 0 ? pair : pair.slice(0, i);
      if (k === name) { try { return decodeURIComponent(i < 0 ? '' : pair.slice(i + 1)); } catch (err) { return ''; } }
    }
    return '';
  }
  can(permission) { return this.mode === 'connected' && this.info.permissions.includes(permission); }
  /** Whether the shell's bridge carries `feature` ('query' | 'revisions' | 'idempotency' | 'navigate'). */
  has(feature) { return this.mode === 'connected' && this.info.features.includes(feature); }
  pluginId() { return (this.info && typeof this.info.plugin.id === 'string' && this.info.plugin.id) || ''; }
  /** The user's role when the server enforces roles; null when auth is off or unknown. */
  role() { return this.info && this.info.user.auth === 'required' ? this.info.user.role : null; }
  /** Whether the user may write at all: any role but viewer. */
  mayWrite() { return this.mode === 'connected' && this.role() !== 'viewer'; }
  /** Whether view `id` is switched on — so a link to it will open. */
  hasView(id) { return this.mode === 'connected' && this.info.views.some((v) => v.id === id); }
  /** Open another view (or 'overview' / 'settings'), with params for it. Resolves false when it cannot. */
  navigate(to, params) {
    if (!this.has('navigate')) return false;
    try { window.parent.postMessage({ type: 'agnostic:navigate', to: String(to), params: params ? String(params) : '' }, '*'); } catch (err) { return false; }
    return true;
  }
  /** `opts`: {ifMatch, ifNoneMatch, idempotencyKey}, each sent only when the shell carries it. */
  request(method, path, body, opts) {
    if (this.mode !== 'connected') return Promise.resolve({ status: 0, data: { error: 'not connected to agnostic' }, etag: null });
    const id = this.prefix + ++this.seq;
    return new Promise((resolve) => {
      const timer = setTimeout(() => { if (this.pending.delete(id)) resolve({ status: 0, data: { error: 'the shell did not answer' }, etag: null }); }, this.timeoutMs);
      this.pending.set(id, { resolve, timer });
      const msg = { type: 'agnostic:request', id, method, path };
      if (body !== undefined) msg.body = body;
      const o = opts || {};
      if (o.ifMatch && this.has('revisions')) msg.ifMatch = o.ifMatch;
      if (o.ifNoneMatch && this.has('revisions')) msg.ifNoneMatch = o.ifNoneMatch;
      if (o.idempotencyKey && this.has('idempotency')) msg.idempotencyKey = o.idempotencyKey;
      try { window.parent.postMessage(msg, '*'); } catch (err) { this.pending.delete(id); clearTimeout(timer); resolve({ status: 0, data: { error: 'the shell is gone' }, etag: null }); }
    });
  }
}
/** The error text of a bridge response. */
function errOf(r) {
  if (r && r.data && typeof r.data.error === 'string') return r.data.error;
  return r && r.status ? 'HTTP ' + r.status : 'the server is unreachable';
}
/* agnostic-kit:host end */

/* =====================================================================================
 *  AUDIT TRAIL — the chain's verdict and its newest entries (0.1.10)
 *
 *  GET /api/v1/audit is the summary: how many entries, whether the chain verified when the
 *  server started (`verified: "open"` — not a moment ago), and how many appends were DROPPED,
 *  which verification cannot see. GET /api/v1/audit/entries pages the newest entries by index
 *  (`next` → `?before=`); the server keeps the newest 1024 for reading (`oldest_held`). Both are
 *  ADMIN routes: the trail records every user's actions.
 *
 *  The "Chain" column checks, for the entries on screen, that each one's `prev_hash` is the
 *  hash of the entry before it. That is a reading aid, not the verification — the server's
 *  pass at start-up re-hashes every entry; this only compares the links it was sent.
 *
 *  Everything above the VIEW section is plain logic with no DOM — tests/webgui/audit.test.mjs
 *  runs it in Node against a fake agnostic.
 * ===================================================================================== */
const SEVERITIES = Object.freeze(['all', 'warning', 'error']);
const AT_LEAST = Object.freeze({ debug: 0, info: 1, warning: 2, error: 3, critical: 4, security: 5 });
const PAGE = 100;
const int = (v) => (Number.isInteger(v) ? v : null);

/** An entry worth showing: an index and an action. */
function validEntry(e) { return !!e && typeof e === 'object' && Number.isInteger(e.index) && e.index >= 0 && typeof e.action === 'string'; }
/** Whether entry `e` passes the severity filter: 'all', or at least 'warning' / 'error'. */
function passesSeverity(e, sev) {
  if (sev === 'all') return true;
  return (AT_LEAST[e.severity] ?? 5) >= (AT_LEAST[sev] ?? 0);
}
/** Whether entry `e` matches the text filter (case-insensitive, action or details). */
function matchesText(e, q) {
  const t = String(q || '').trim().toLowerCase();
  if (!t) return true;
  return String(e.action).toLowerCase().includes(t) || String(e.details || '').toLowerCase().includes(t);
}
/**
 * For entries sorted newest first, each one's link to the entry below it: 'ok' when its
 * `prev_hash` is the hash of index − 1 as sent, 'broken' when it is not, and '' when the entry
 * below is not on screen (or this is the first entry of the chain).
 */
function linkStates(entries) {
  const byIndex = new Map(entries.map((e) => [e.index, e]));
  const out = new Map();
  for (const e of entries) {
    const below = byIndex.get(e.index - 1);
    if (!below || typeof e.prev_hash !== 'string' || typeof below.hash !== 'string') { out.set(e.index, ''); continue; }
    out.set(e.index, e.prev_hash === below.hash ? 'ok' : 'broken');
  }
  return out;
}
/** Merge a fresh first page into the entries held (newest first): new ones go on top. */
function mergeNewest(held, fresh) {
  const top = held.length ? held[0].index : -1;
  const add = fresh.filter((e) => e.index > top);
  return add.concat(held);
}

/** The trail: its summary and the entries read so far. */
class AuditTrail {
  constructor(host) {
    this.host = host;
    this.summary = null;
    this.summaryError = '';
    this.entries = [];          // newest first
    this.next = null;           // the index to send as ?before=
    this.oldestHeld = 0;
    this.total = 0;
    this.error = '';
    this.loading = false;
    this.listeners = new Set();
  }
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit() { for (const fn of this.listeners) fn(this); }
  errorText(r, what) {
    if (r.status === 401) return 'Sign in as an administrator to read the audit trail.';
    if (r.status === 403 && !(r.data && typeof r.data.code === 'string' && r.data.code.startsWith('plugin_'))) return 'The audit trail is for administrators: it records every user’s actions.';
    return 'Could not read ' + what + ': ' + errOf(r);
  }
  page(r) {
    if (r.status !== 200 || !r.data || !Array.isArray(r.data.entries)) return null;
    return { entries: r.data.entries.filter(validEntry), next: int(r.data.next), oldest: int(r.data.oldest_held) ?? 0, total: int(r.data.total) ?? 0 };
  }
  async load() {
    this.loading = true;
    this.emit();
    const [s, r] = await Promise.all([this.host.request('GET', '/api/v1/audit'), this.host.request('GET', '/api/v1/audit/entries?limit=' + PAGE)]);
    this.loading = false;
    if (s.status === 200 && s.data && typeof s.data === 'object') { this.summary = s.data; this.summaryError = ''; }
    else { this.summary = null; this.summaryError = this.errorText(s, 'its summary'); }
    const p = this.page(r);
    if (!p) { this.error = this.errorText(r, 'its entries'); this.emit(); return false; }
    this.error = '';
    this.entries = p.entries;
    this.next = p.next;
    this.oldestHeld = p.oldest;
    this.total = p.total;
    this.emit();
    return true;
  }
  /** The next older page. */
  async more() {
    if (this.next === null || this.loading) return false;
    this.loading = true;
    this.emit();
    const r = await this.host.request('GET', '/api/v1/audit/entries?limit=' + PAGE + '&before=' + this.next);
    this.loading = false;
    const p = this.page(r);
    if (!p) { this.error = this.errorText(r, 'its entries'); this.emit(); return false; }
    const have = new Set(this.entries.map((e) => e.index));
    for (const e of p.entries) if (!have.has(e.index)) this.entries.push(e);
    this.next = p.next;
    this.oldestHeld = p.oldest;
    this.emit();
    return true;
  }
  /** New entries since the last read go on top; the summary is read again. */
  async refresh() {
    if (this.loading) return false;
    const [s, r] = await Promise.all([this.host.request('GET', '/api/v1/audit'), this.host.request('GET', '/api/v1/audit/entries?limit=' + PAGE)]);
    if (s.status === 200 && s.data && typeof s.data === 'object') this.summary = s.data;
    const p = this.page(r);
    if (!p) { this.error = this.errorText(r, 'its entries'); this.emit(); return false; }
    this.error = '';
    const top = this.entries.length ? this.entries[0].index : -1;
    const gap = p.entries.length && p.entries[p.entries.length - 1].index > top + 1 && top >= 0;
    // More arrived than a page holds: start again from the newest rather than leave a hole.
    if (gap) { this.entries = p.entries; this.next = p.next; }
    else this.entries = mergeNewest(this.entries, p.entries);
    if (!this.entries.length) this.next = p.next;
    this.oldestHeld = p.oldest;
    this.total = p.total;
    this.emit();
    return true;
  }
}

/* =====================================================================================
 *  VIEW — the DOM. Every value from the server is written with textContent.
 * ===================================================================================== */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}

class AuditView {
  constructor(host) {
    this.host = host;
    this.trail = new AuditTrail(host);
    this.$ = (id) => document.getElementById(id);
    this.sev = 'all';
    const box = this.$('sev');
    for (const s of SEVERITIES) {
      const b = el('button', 'chip', s === 'all' ? 'All' : s === 'warning' ? 'Warnings and worse' : 'Errors and worse');
      b.type = 'button';
      b.dataset.sev = s;
      b.addEventListener('click', () => { this.sev = s; this.render(); });
      box.append(b);
    }
    this.$('q').addEventListener('input', () => this.renderRows());
    this.$('refresh').addEventListener('click', () => this.trail.refresh());
    this.trail.onChange(() => this.render());
    host.onChange(() => { if (this.state() === 'ready') this.trail.load(); else this.render(); });
    setInterval(() => { if (this.state() === 'ready' && !document.hidden && !this.trail.error) this.trail.refresh(); }, 15000);
    this.render();
  }
  state() {
    if (this.host.mode !== 'connected') return this.host.mode;
    return this.host.can('audit:read') ? 'ready' : 'forbidden';
  }
  render() {
    const st = this.state();
    this.$('main').hidden = st !== 'ready';
    let msg = this.$('message');
    if (st !== 'ready') {
      if (!msg) { msg = el('div', 'empty'); msg.id = 'message'; document.body.append(msg); }
      msg.textContent = st === 'standalone' ? 'This view shows an agnostic server’s audit trail. Open it from agnostic’s WebGUI (/ui), as an administrator.'
        : st === 'forbidden' ? 'This build of the Audit view was not granted audit:read.' : 'Connecting to agnostic…';
      return;
    }
    if (msg) msg.remove();
    for (const b of this.$('sev').children) b.setAttribute('aria-pressed', String(b.dataset.sev === this.sev));
    this.renderSummary();
    this.renderRows();
  }
  renderSummary() {
    const t = this.trail, s = t.summary;
    const facts = this.$('facts');
    facts.replaceChildren();
    const note = this.$('summary-note');
    note.replaceChildren();
    if (!s) { if (t.summaryError) note.append(el('div', 'box bad', t.summaryError)); return; }
    const fact = (k, v, cls, title) => { const f = el('div', 'fact' + (cls ? ' ' + cls : '')); f.append(el('div', 'k', k), el('div', 'v', v)); if (title) f.title = title; facts.append(f); };
    fact('Chain', s.intact === true ? 'verified' : 'BROKEN', s.intact === true ? 'ok' : 'bad', 'checked when the server started (' + String(s.verified || 'open') + ')');
    fact('Entries', String(int(s.total) ?? '—'));
    fact('At start-up', String(int(s.entries_at_open) ?? '—'), '', 'entries the store held when this server started');
    fact('Since', String(int(s.appended) ?? '—'), '', 'entries this server has appended');
    fact('Dropped', String(int(s.dropped) ?? '—'), int(s.dropped) > 0 ? 'bad' : '', 'appends that failed — gaps verification cannot see');
    if (s.intact !== true) note.append(el('div', 'box bad', 'The chain failed verification when the server started' + (int(s.bad_index) !== null ? ', first at entry #' + s.bad_index : '') + ': the stored trail was altered while the server was not running. It keeps recording, so the tampering is bracketed.'));
    if (int(s.dropped) > 0) note.append(el('div', 'box warn', s.dropped + ' audit records could not be written. The chain still verifies, because a record never written leaves no hole to find — this count is the only sign of them.'));
  }
  renderRows() {
    const t = this.trail;
    const body = this.$('rows');
    body.replaceChildren();
    const q = this.$('q').value;
    const links = linkStates(t.entries);
    let shown = 0;
    for (const e of t.entries) {
      if (!passesSeverity(e, this.sev) || !matchesText(e, q)) continue;
      shown++;
      const tr = el('tr');
      tr.append(el('td', 'n', '#' + e.index), el('td', 'ts', String(e.timestamp || '').replace('T', ' ').replace('Z', ' UTC')));
      const sv = el('td');
      sv.append(el('span', 'sev ' + String(e.severity).replace(/[^a-z]/g, ''), e.severity));
      tr.append(sv, el('td', 'act', e.action), el('td', 'det', (e.details || '') + (e.cut ? ' …' : '')));
      const h = el('td', 'h');
      const link = links.get(e.index);
      h.append(el('span', null, String(e.hash || '').slice(0, 10)));
      if (link) h.append(el('span', link === 'ok' ? 'ok' : 'bad', link === 'ok' ? ' ← ✓' : ' ← ✗'));
      h.title = link === 'ok' ? 'links to #' + (e.index - 1) + ' as sent' : link === 'broken' ? 'does NOT link to #' + (e.index - 1) + ' as sent' : 'the entry before it is not on screen';
      tr.append(h);
      body.append(tr);
    }
    const more = this.$('more');
    more.replaceChildren();
    if (t.error) more.append(el('div', 'box bad', t.error));
    else if (t.loading && !t.entries.length) more.append(el('span', 'muted', 'Loading…'));
    else if (!t.entries.length) more.append(el('span', 'muted', 'The trail is empty.'));
    else {
      if (shown < t.entries.length) more.append(el('span', 'muted', shown + ' of ' + t.entries.length + ' loaded entries match.'));
      if (t.next !== null) {
        const b = el('button', 'btn', t.loading ? 'Loading…' : 'Older entries');
        b.type = 'button';
        b.disabled = t.loading;
        b.addEventListener('click', () => t.more());
        more.append(b);
      } else if (t.oldestHeld > 0) {
        more.append(el('span', 'muted', 'Entries before #' + t.oldestHeld + ' are in the store and were verified at start-up; this view shows the newest ' + (t.total - t.oldestHeld) + '.'));
      }
    }
  }
}

if (typeof document !== 'undefined' && document.getElementById('rows')) {
  window.audit = new AuditView(new Host());
}
</script>
