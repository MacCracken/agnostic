name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Verify version consistency
        # VERSION is the single source of truth; cyrius.cyml derives it
        # via version = "${file:VERSION}". Both must equal the pushed tag
        # (matches patra / sigil).
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        # Canonical installer — see ci.yml for rationale.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain matches the pin
        # A release must never be cut by a toolchain other than the pinned one.
        # See ci.yml for why this is fatal rather than advisory.
        run: |
          set -e
          cyrius --version
          if cyrius --version 2>&1 | grep -q 'drift'; then
            echo "::error::toolchain drift — refusing to cut a release off-pin"
            exit 1
          fi

      - name: Sync the pinned stdlib snapshot
        # `cyrius deps` only OVERLAYS [deps.NAME]; against an empty lib/ it fails.
        run: cyrius lib sync --full

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build x86_64 (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/agnostic
          xxd -l 4 build/agnostic | grep -q "7f45 4c46" \
            || { echo "::error::x86_64 output is not an ELF binary"; exit 1; }

      - name: Build aarch64 (DCE)
        # first-party-standards.md:963 DON'T — "Release without aarch64 builds
        # (where the toolchain supports it)". Fatal here, unlike CI's skip:
        # a tagged release that silently ships one architecture is the failure
        # the checklist is guarding against.
        #
        # Withheld 0.1.7–0.1.9: the binary died with SIGBUS at startup on real
        # aarch64 hardware, because cyrius did not re-align the global after a
        # typed array. cyrius 6.6.13 aligns every global (I9); restored at 0.1.10
        # once every suite and the server ran natively on a Raspberry Pi 4.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ] && [ ! -x "$HOME/.cyrius/bin/cycc-native-aarch64" ]; then
            echo "::error::no aarch64 cross compiler in the pinned bundle — cannot satisfy the release checklist"
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/agnostic-aarch64
          file build/agnostic-aarch64 | grep -q "ARM aarch64" \
            || { echo "::error::aarch64 output is not an ARM binary"; exit 1; }

      - name: Benchmarks
        # first-party-standards.md:419 — "every tagged release runs cyrius bench
        # and attaches results as release assets. Every version gets a
        # permanent, reproducible performance snapshot."
        continue-on-error: true
        run: |
          if ls benches/*.bcyr tests/*.bcyr >/dev/null 2>&1; then
            cyrius bench 2>&1 | tee bench-results.txt
          else
            echo "no benchmarks yet" > bench-results.txt
          fi

      - name: Extract changelog
        # Pull the tagged section out of CHANGELOG.md for the release body.
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk "/^## \\[$TAG\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          [ -n "$BODY" ] || BODY="No changelog entry for $TAG."
          echo "$BODY" > /tmp/release-body.md

      - name: Source tarball + checksums
        # The source tarball + SHA256SUMS are what `cyrius deps` fetches and
        # sha256-verifies downstream — without them this project cannot be
        # consumed as a dependency. This is the release artifact, not just
        # the built binary.
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="$NAME-$TAG/" -o "$NAME-$TAG.tar.gz" HEAD
          sha256sum "$NAME-$TAG.tar.gz" build/agnostic build/agnostic-aarch64 > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (pinned — CVE-21)
        with:
          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          body_path: /tmp/release-body.md
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz
            SHA256SUMS
            build/agnostic
            build/agnostic-aarch64
            bench-results.txt
